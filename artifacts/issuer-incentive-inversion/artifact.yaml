controls:
  - id: issuer.granular-status
    requirement: Revocation and correction events must remain attributable to the responsible issuing authority at institution-level granularity.
  - id: issuer.error-legibility
    requirement: Issuer reliability evidence must not be aggregated or obscured in ways that prevent independent evaluation of correction and revocation behavior.
  - id: issuer.redress-traceability
    requirement: A disputed claim must be traceable from issuance through correction, revocation, downstream reliance, and remediation.
  - id: issuer.no-participation-selection-bias
    requirement: Assurance claims derived from voluntary pilots must disclose participation-selection effects and must not be generalized to non-participating issuers without evidence.
  - id: issuer.accountability-retention
    requirement: Lifecycle evidence required to establish issuer accountability must remain auditable for the applicable governance period.
  - id: issuer.no-intermediary-obfuscation
    requirement: Aggregation or middleware must not sever the relying party's ability to resolve primary issuer authority and lifecycle evidence.
