controls:
  - id: accreditation.task-class
    requirement: Capability accreditation must be specific to a defined task class and risk tier.
  - id: accreditation.configuration-binding
    requirement: Accreditation must bind to the evaluated model, tool-access, and operating-context configuration and be re-evaluated after material change.
  - id: accreditation.issuer-authority
    requirement: The accreditation issuer must have resolvable authority for the capability class and must not rely solely on self-interested platform affiliation.
  - id: accreditation.scope
    requirement: The attempted action must be within both the accredited capability and the principal's delegated authority.
  - id: accreditation.assurance
    requirement: The capability assurance level must satisfy the relying workflow's consequence and risk requirements.
  - id: accreditation.revocation
    requirement: Accreditation status and revocation must be current and independently resolvable at effect time.
  - id: accreditation.auditability
    requirement: Consequential admission decisions must produce evidence sufficient to reconstruct capability, scope, configuration, issuer authority, and lifecycle state.
