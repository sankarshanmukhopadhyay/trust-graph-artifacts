name: Publish TGA Component Release

on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'docs/release-notes/v0.13.0.md'
      - '.github/workflows/publish-component-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-tga-v0.13.0
  cancel-in-progress: false

env:
  VERSION: '0.13.0'
  TAG: 'v0.13.0'
  RELEASE_TITLE: 'Trust Graph Artifacts v0.13.0 — Action-Specific Authority and Lifecycle Invalidation'
  RELEASE_NOTES: 'docs/release-notes/v0.13.0.md'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: python -m pip install jsonschema pyyaml
      - name: Verify release source and canonical gate
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < VERSION)" = "$VERSION"
          test -s "$RELEASE_NOTES"
          make validate
      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$RELEASE_TITLE" --notes-file "$RELEASE_NOTES" --latest
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes-file "$RELEASE_NOTES" --latest
          fi
          gh release view "$TAG" --json url,tagName,name,targetCommitish,isDraft,isPrerelease
          test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = "false"
          test "$(gh release view "$TAG" --json isPrerelease --jq '.isPrerelease')" = "false"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')" = "$TAG"
