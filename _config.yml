title: Trust Graph Artifacts
description: Executable governance patterns, assurance artifacts, and implementation guidance for governed trust systems.
url: "https://sankarshanmukhopadhyay.github.io"
baseurl: "/trust-graph-artifacts"
repository: sankarshanmukhopadhyay/trust-graph-artifacts

remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

markdown: kramdown
highlighter: rouge
permalink: pretty
strict_front_matter: true

search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/

heading_anchors: true
nav_sort: case_insensitive
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  "Trust Graph Artifacts on GitHub":
    - "https://github.com/sankarshanmukhopadhyay/trust-graph-artifacts"

footer_content: "Trust Graph Artifacts: executable governance patterns, portable evidence, and adoption guidance."
last_edit_timestamp: true
last_edit_time_format: "%Y-%m-%d %H:%M"
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/sankarshanmukhopadhyay/trust-graph-artifacts"
gh_edit_branch: "main"
gh_edit_view_mode: "tree"

callouts:
  governance:
    title: Governance note
    color: blue
  assurance:
    title: Assurance note
    color: green
  warning:
    title: Warning
    color: yellow
  implementation:
    title: Implementation gate
    color: purple

mermaid:
  version: "10.9.1"

color_scheme: tga

exclude:
  - .github/
  - .gitignore
  - Gemfile.lock
  - vendor/
  - node_modules/
  - COMMIT_BUNDLE_*.md
  - scripts/
  - "*.zip"
