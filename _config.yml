title: Trust Graph Artifacts
description: Executable governance patterns, assurance artifacts, and implementation guidance for governed trust systems.
url: "https://sankarshanmukhopadhyay.github.io"
baseurl: "/trust-graph-artifacts"
repository: sankarshanmukhopadhyay/trust-graph-artifacts

remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

markdown: kramdown
highlighter: rouge
permalink: pretty
strict_front_matter: true

search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/

heading_anchors: true
nav_sort: case_insensitive
back_to_top: true
back_to_top_text: "Back to top"

# Navigation is curated by reader intent. Documentation remains searchable and
# directly addressable even when it is not exposed in the primary sidebar.
defaults:
  - scope:
      path: "docs"
    values:
      nav_exclude: true
  - scope:
      path: "docs/index.md"
    values:
