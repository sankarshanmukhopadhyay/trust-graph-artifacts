schema_version: "1.0"
project:
  name: trust-graph-artifacts
  maturity: implementation-draft
  lifecycle: active
  operational_status: active-development
  specification_status: not-applicable
  intended_use:
    - executable-governance-incubation
    - implementation-guidance
    - negative-assurance-testing
    - epistemic-governance-experimentation
  not_asserted:
    - production-certification
    - canonical-semantic-authority
    - portable-schema-authority
authority:
  normative_scope:
    - governance-patterns
    - implementation-guidance
    - negative-assurance-tests
    - epistemic-governance-patterns
  does_not_own:
    - canonical-semantics
    - portable-schema-contracts
    - external-protocol-governance
  delegation: "Repository maintainers govern incubated patterns, implementation guidance, and project-local assurance artifacts; canonical semantics and portable contracts remain with their declared authority repositories."
  revocation_or_supersession: "Patterns, guidance, evidence, and status claims are superseded through explicit versioned changes while historical artifacts remain auditable."
evidence:
  validation_commands:
    - make validate
  evidence_outputs:
    - governance/repository-authority.yaml
    - data/portfolio-relationships.json
    - artifacts/provenance-backed-reputation/tests/assurance-cases.yaml
    - artifacts/context-bound-identifier-use/tests/assurance-cases.yaml
    - artifacts/verifiable-trade-corridor/tests/assurance-cases.yaml
  known_limitations:
    - incubated patterns are not automatically canonical portfolio semantics
    - project-local evidence is not independent certification
release:
  current_version: 0.8.0
dependencies:
  - repository: trust-systems-meta-model
    role: canonical-semantic-model
    compatibility: v0.24.0 reviewed baseline
  - repository: trust-infrastructure-schemas
    role: portable-schema-contracts
    compatibility: v0.14.1 reviewed baseline
review:
  last_review: "2026-08-20"
