cases:
- id: AE-VALID-001
  description: High-consequence action has complete envelope, active authority, fresh
    revocation state, receipt, and redress route.
  expectedDecision: allow
  envelope:
    technicalActorRef: agent.procurement.outreach.v1
    accountableControllerRef: org.example.procurement-office
    principalRef: org.example.buying-entity
    mandateRef: mandate.procurement.rfq.2026-05
    scopeBoundary:
      purpose:
      - vendor-shortlisting
      riskTier: high
    policyVersion: procurement-policy@2026.05.1
    evidenceRefs:
    - evidence.execution-time-delegation.example
    revocationStateChecked:
      checked: true
      authorityState: active
      cacheAgeSeconds: 12
      maxCacheAgeSeconds: 60
    decisionReceiptRef: urn:tga:receipt:decision:procurement-outreach:2026-05-14
    redressRoute:
      routeRef: redress.procurement.review-board
      humanReviewAvailable: true
    executionContext:
      requestedEffect: send-rfq-outreach
      highConsequence: true
- id: AE-DENY-STALE-001
