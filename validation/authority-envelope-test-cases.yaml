      humanReviewAvailable: true
    executionContext:
      requestedEffect: send-rfq-outreach
      highConsequence: true
- id: AE-ESCALATE-MISSING-REDRESS-001
  description: Consequential action lacks a redress route and cannot be accepted without
    review.
  expectedDecision: escalate
  envelope:
    technicalActorRef: agent.benefits.routing.v1
