    principalRef: resident.example
    mandateRef: mandate.benefits.routing
    scopeBoundary:
      purpose:
      - benefits-routing
      riskTier: critical
    policyVersion: benefits-routing-policy@2026.05
    evidenceRefs:
    - evidence.application
    revocationStateChecked:
      checked: true
      authorityState: active
      cacheAgeSeconds: 5
      maxCacheAgeSeconds: 30
    decisionReceiptRef: urn:tga:receipt:decision:benefits-routing
    executionContext:
      requestedEffect: route-benefits-application
      highConsequence: true

- id: AE-COMMIT-VALID-001
  description: Material commitment has active authority, satisfied constraints, and exact-action evidence.
  expectedDecision: allow
  envelope:
    technicalActorRef: agent.procurement.commit.v1
    accountableControllerRef: org.example.procurement-office
    principalRef: org.example.buying-entity
    mandateRef: mandate.procurement.commit.2026-09
    scopeBoundary:
      purpose: [procurement-commitment]
    policyVersion: procurement-policy@2026.09
    evidenceRefs: [evidence.commitment-authority.current]
    revocationStateChecked:
      checked: true
      authorityState: active
      cacheAgeSeconds: 5
      maxCacheAgeSeconds: 60
    decisionReceiptRef: urn:tga:receipt:decision:commit-valid
    redressRoute:
      routeRef: redress.procurement.review-board
      humanReviewAvailable: true
    executionContext:
      requestedEffect: procurement-commit
      highConsequence: true
      materialCommitment: true
    commitment:
      actionDigest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      evaluatedAt: '2026-09-22T12:00:00Z'
      constraintResults:
        scope: satisfied
        amount_limit: satisfied
      approvalRequired: false

