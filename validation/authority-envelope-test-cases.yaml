  envelope:
    technicalActorRef: agent.procurement.outreach.v1
    accountableControllerRef: org.example.procurement-office
    principalRef: org.example.buying-entity
    mandateRef: mandate.procurement.rfq.old
    scopeBoundary:
      purpose:
      - vendor-shortlisting
      riskTier: high
    policyVersion: procurement-policy@2026.05.1
    evidenceRefs:
    - evidence.old-delegation
    revocationStateChecked:
      checked: true
      authorityState: stale
      cacheAgeSeconds: 40
      maxCacheAgeSeconds: 60
    decisionReceiptRef: urn:tga:receipt:decision:stale-block
    redressRoute:
