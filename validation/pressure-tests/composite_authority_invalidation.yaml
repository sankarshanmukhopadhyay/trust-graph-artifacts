version: 1
fixture_id: tga.composite-authority.invalidation
status: experimental
authority_boundary:
  tsmm: canonical semantics
  tis: portable contracts
  tga: executable pressure-test composition
cases:
  - id: TGA-CA-001
    title: current 2-of-3 authority exercise
    principal: org:buyer.example
    threshold: 2
    current_members: [controller:a, controller:b, controller:c]
    evidence_members: [controller:a, controller:b]
    membership_state: current
    rule_state: current
    exact_action_binding: true
    expected:
      current_authorization: permit
      historical_verification: preserved

  - id: TGA-CA-002
    title: one-of-three is insufficient
    principal: org:buyer.example
    threshold: 2
    current_members: [controller:a, controller:b, controller:c]
    evidence_members: [controller:a]
    membership_state: current
    rule_state: current
    exact_action_binding: true
    expected:
      current_authorization: deny
      historical_verification: preserved

  - id: TGA-CA-003
    title: duplicate controller cannot satisfy threshold
    principal: org:buyer.example
    threshold: 2
    current_members: [controller:a, controller:b, controller:c]
    evidence_members: [controller:a, controller:a]
    membership_state: current
    rule_state: current
    exact_action_binding: true
    expected:
      current_authorization: deny
      historical_verification: preserved

  - id: TGA-CA-004
    title: stale membership invalidates current exercise evidence
    principal: org:buyer.example
    threshold: 2
    current_members: [controller:a, controller:c, controller:d]
    evidence_members: [controller:a, controller:b]
    membership_state: stale
    rule_state: current
    exact_action_binding: true
    expected:
      current_authorization: reassessment_required
      historical_verification: preserved

  - id: TGA-CA-005
    title: stale threshold rule invalidates current exercise evidence
    principal: org:buyer.example
    threshold: 3
    current_members: [controller:a, controller:b, controller:c]
    evidence_members: [controller:a, controller:b]
    membership_state: current
    rule_state: stale
    exact_action_binding: true
    expected:
      current_authorization: reassessment_required
      historical_verification: preserved

  - id: TGA-CA-006
    title: missing composition evidence remains indeterminate
    principal: org:buyer.example
    threshold: 2
    current_members: [controller:a, controller:b, controller:c]
    evidence_members: [controller:a, controller:b]
    membership_state: current
    rule_state: missing
    exact_action_binding: true
    expected:
      current_authorization: indeterminate
      historical_verification: preserved

  - id: TGA-CA-007
    title: action digest mismatch denies the exercise
    principal: org:buyer.example
    threshold: 2
    current_members: [controller:a, controller:b, controller:c]
    evidence_members: [controller:a, controller:b]
    membership_state: current
    rule_state: current
    exact_action_binding: false
    expected:
      current_authorization: deny
      historical_verification: preserved
